<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 - 한국 웹 접근성 플레이그라운드</title>
  <meta name="description" content="입력 오류를 고치고 필수 약관에 동의해 가입을 완료합니다.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">본문 바로가기</a>
  <header class="site-header">
    <p class="brand">푸른숲도서관</p>
  </header>

  <main id="main" tabindex="-1">
    <section id="signup-view" class="card" aria-labelledby="signup-title">
      <h1 id="signup-title">회원가입</h1>
      <p class="note"><span class="dot-sample" aria-hidden="true"></span>입력란은 모두 필수이고, [필수] 약관에 동의해야 가입할 수 있습니다.</p>

      <div id="error-summary" class="summary" role="group" tabindex="-1" aria-labelledby="summary-title" hidden>
        <p id="summary-title" class="summary-title"></p>
        <ul id="summary-list"></ul>
      </div>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="userid">아이디 <span class="req">필수</span> <span class="hint">(영문 소문자·숫자 4~12자)</span></label>
          <div class="control">
            <input type="text" id="userid" name="userid" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30" required aria-required="true" aria-describedby="userid-error">
          </div>
          <p class="error" id="userid-error"></p>
        </div>

        <div class="field">
          <label for="password">비밀번호 <span class="req">필수</span> <span class="hint">(8자 이상)</span></label>
          <div class="control">
            <input type="password" id="password" name="password" autocomplete="new-password" required aria-required="true" aria-describedby="password-error">
          </div>
          <p class="error" id="password-error"></p>
        </div>

        <div class="field">
          <label for="password2">비밀번호 확인 <span class="req">필수</span> <span class="hint">(비밀번호를 한 번 더 입력)</span></label>
          <div class="control">
            <input type="password" id="password2" name="password2" autocomplete="new-password" required aria-required="true" aria-describedby="password2-error">
          </div>
          <p class="error" id="password2-error"></p>
        </div>

        <div class="field">
          <label for="email">이메일 <span class="req">필수</span> <span class="hint">(예: name@example.com)</span></label>
          <div class="control">
            <input type="email" id="email" name="email" autocomplete="email" required aria-required="true" aria-describedby="email-error">
          </div>
          <p class="error" id="email-error"></p>
        </div>

        <div class="terms">
          <div class="check all">
            <input type="checkbox" id="agree-all">
            <label for="agree-all">전체 동의</label>
          </div>
          <fieldset aria-describedby="terms-error">
            <legend class="sr-only">약관 동의</legend>
            <div class="check">
              <input type="checkbox" id="agree-terms" name="terms" required aria-required="true">
              <label for="agree-terms">[필수] 이용약관 동의</label>
            </div>
            <div class="check">
              <input type="checkbox" id="agree-privacy" name="privacy" required aria-required="true">
              <label for="agree-privacy">[필수] 개인정보 수집·이용 동의</label>
            </div>
            <div class="check">
              <input type="checkbox" id="agree-news" name="news">
              <label for="agree-news">[선택] 소식 메일 받기</label>
            </div>
          </fieldset>
          <p class="error" id="terms-error"></p>
        </div>

        <button type="submit" class="submit">가입하기</button>
      </form>
    </section>

    <section id="done-view" class="card" aria-labelledby="done-title" hidden>
      <div class="done-mark" aria-hidden="true"></div>
      <h1 id="done-title" tabindex="-1">가입이 완료되었습니다</h1>
      <p id="done-message" class="done-text"></p>
      <p class="done-text">푸른숲도서관의 다양한 서비스를 이용해 보세요.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>푸른숲도서관 (가상의 기관 화면입니다)</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
