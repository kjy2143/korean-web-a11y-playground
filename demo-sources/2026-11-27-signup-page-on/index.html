<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 - 한국 웹 접근성 플레이그라운드</title>
<meta name="description" content="입력 오류를 고치고 필수 약관에 동의해 가입을 완료합니다.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>
<header class="site-header">
  <p class="site-name">푸른숲도서관</p>
</header>
<main id="main" tabindex="-1">
  <section id="signup-view">
    <h1>회원가입</h1>
    <p id="status" class="vh" role="status"></p>
    <div id="error-summary" class="summary" hidden></div>
    <form id="signup-form" novalidate>
      <div class="field">
        <label for="userid"><span class="lbl-name">아이디</span> <span class="hint">(영문 소문자·숫자 4~12자)</span> <span class="req">필수</span></label>
        <div class="control">
          <input type="text" id="userid" name="userid" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30" aria-required="true" aria-describedby="userid-err">
          <span class="dot" aria-hidden="true"></span>
        </div>
        <p class="err" id="userid-err"></p>
      </div>

      <div class="field">
        <label for="pw"><span class="lbl-name">비밀번호</span> <span class="hint">(8자 이상)</span> <span class="req">필수</span></label>
        <div class="control">
          <input type="password" id="pw" name="pw" autocomplete="new-password" aria-required="true" aria-describedby="pw-err">
          <span class="dot" aria-hidden="true"></span>
        </div>
        <p class="err" id="pw-err"></p>
      </div>

      <div class="field">
        <label for="pw2"><span class="lbl-name">비밀번호 확인</span> <span class="hint">(비밀번호를 한 번 더 입력)</span> <span class="req">필수</span></label>
        <div class="control">
          <input type="password" id="pw2" name="pw2" autocomplete="new-password" aria-required="true" aria-describedby="pw2-err">
          <span class="dot" aria-hidden="true"></span>
        </div>
        <p class="err" id="pw2-err"></p>
      </div>

      <div class="field">
        <label for="email"><span class="lbl-name">이메일</span> <span class="hint">(예: name@example.com)</span> <span class="req">필수</span></label>
        <div class="control">
          <input type="email" id="email" name="email" autocomplete="email" aria-required="true" aria-describedby="email-err">
          <span class="dot" aria-hidden="true"></span>
        </div>
        <p class="err" id="email-err"></p>
      </div>

      <fieldset class="terms">
        <legend>약관 동의</legend>
        <div class="chk all">
          <input type="checkbox" id="agree-all">
          <label for="agree-all"><span class="ico" aria-hidden="true"></span>전체 동의</label>
        </div>
        <div class="chk">
          <input type="checkbox" id="agree-terms" name="terms" aria-required="true" aria-describedby="terms-err">
          <label for="agree-terms"><span class="ico" aria-hidden="true"></span>[필수] 이용약관 동의</label>
        </div>
        <p class="err" id="terms-err"></p>
        <div class="chk">
          <input type="checkbox" id="agree-privacy" name="privacy" aria-required="true" aria-describedby="privacy-err">
          <label for="agree-privacy"><span class="ico" aria-hidden="true"></span>[필수] 개인정보 수집·이용 동의</label>
        </div>
        <p class="err" id="privacy-err"></p>
        <div class="chk">
          <input type="checkbox" id="agree-news" name="news">
          <label for="agree-news"><span class="ico" aria-hidden="true"></span>[선택] 소식 메일 받기</label>
        </div>
      </fieldset>

      <button type="submit" class="submit">가입하기</button>
    </form>
  </section>

  <section id="done-view" hidden>
    <h1 id="done-title" tabindex="-1">가입이 완료되었습니다</h1>
    <p><strong id="done-id"></strong>님, 푸른숲도서관 회원이 되신 것을 환영합니다.</p>
    <p id="done-news"></p>
    <a class="submit link" href="index.html">처음으로</a>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
