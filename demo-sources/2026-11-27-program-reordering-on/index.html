<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관심 프로그램 - 한국 웹 접근성 플레이그라운드</title>
<meta name="description" content="관심 프로그램 카드의 순서를 바꿉니다.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site"><p>푸른숲도서관</p></header>
<main>
<h1>관심 프로그램</h1>
<p class="help">점 여섯 개 손잡이를 끌어 다른 카드 위에 놓거나, 카드 오른쪽의 위·아래 버튼을 눌러 순서를 바꿉니다. 끌기를 취소하려면 Esc 키를 누르거나 카드 밖에서 놓습니다.</p>
<ol class="list" id="list">
<li class="card">
<span class="grip" aria-hidden="true"><svg viewBox="0 0 12 18" focusable="false"><g fill="currentColor"><circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/><circle cx="3" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="3" cy="15" r="1.6"/><circle cx="9" cy="15" r="1.6"/></g></svg></span>
<div class="body"><h2>그림책 읽기</h2><p class="meta">토 10:00 · 어린이실</p></div>
<div class="moves">
<button type="button" class="mv" data-dir="up" aria-label="그림책 읽기 위로 이동"><svg viewBox="0 0 12 8" aria-hidden="true" focusable="false"><path d="M1.5 6.5 6 2l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
<button type="button" class="mv" data-dir="down" aria-label="그림책 읽기 아래로 이동"><svg viewBox="0 0 12 8" aria-hidden="true" focusable="false"><path d="M1.5 1.5 6 6l4.5-4.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
</div>
</li>
<li class="card">
<span class="grip" aria-hidden="true"><svg viewBox="0 0 12 18" focusable="false"><g fill="currentColor"><circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/><circle cx="3" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="3" cy="15" r="1.6"/><circle cx="9" cy="15" r="1.6"/></g></svg></span>
<div class="body"><h2>동네 사진 산책</h2><p class="meta">일 14:00 · 1층 로비</p></div>
<div class="moves">
<button type="button" class="mv" data-dir="up" aria-label="동네 사진 산책 위로 이동"><svg viewBox="0 0 12 8" aria-hidden="true" focusable="false"><path d="M1.5 6.5 6 2l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
<button type="button" class="mv" data-dir="down" aria-label="동네 사진 산책 아래로 이동"><svg viewBox="0 0 12 8" aria-hidden="true" focusable="false"><path d="M1.5 1.5 6 6l4.5-4.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
</div>
</li>
<li class="card">
<span class="grip" aria-hidden="true"><svg viewBox="0 0 12 18" focusable="false"><g fill="currentColor"><circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/><circle cx="3" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="3" cy="15" r="1.6"/><circle cx="9" cy="15" r="1.6"/></g></svg></span>
<div class="body"><h2>겨울 글쓰기 모임</h2><p class="meta">수 19:00 · 세미나실</p></div>
<div class="moves">
<button type="button" class="mv" data-dir="up" aria-label="겨울 글쓰기 모임 위로 이동"><svg viewBox="0 0 12 8" aria-hidden="true" focusable="false"><path d="M1.5 6.5 6 2l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
<button type="button" class="mv" data-dir="down" aria-label="겨울 글쓰기 모임 아래로 이동"><svg viewBox="0 0 12 8" aria-hidden="true" focusable="false"><path d="M1.5 1.5 6 6l4.5-4.5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
</div>
</li>
</ol>
<p class="sr" role="status" id="live"></p>
</main>
<script src="script.js"></script>
</body>
</html>
