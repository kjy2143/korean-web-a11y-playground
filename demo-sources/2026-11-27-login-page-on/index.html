<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 - 한국 웹 접근성 플레이그라운드</title>
<meta name="description" content="예시 계정으로 로그인하고 로그아웃합니다.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>푸른숲도서관 로그인</h1>
  <form id="login-form" novalidate>
    <div class="field">
      <div class="box">
        <input type="text" id="user-id" name="user-id" placeholder=" " autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="user-id-error">
        <label for="user-id">아이디</label>
      </div>
      <p class="error" id="user-id-error"></p>
    </div>
    <div class="field">
      <div class="box pw-wrap">
        <input type="password" id="password" name="password" placeholder=" " autocomplete="current-password" aria-describedby="password-error">
        <label for="password">비밀번호</label>
        <button type="button" class="eye" id="toggle-pw" aria-label="비밀번호 표시" aria-pressed="false">
          <svg class="icon-show" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <svg class="icon-hide" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" hidden><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p class="error" id="password-error"></p>
    </div>
    <button type="submit" class="submit">로그인</button>
  </form>
  <ul class="links">
    <li><a href="#">아이디 찾기</a></li>
    <li><a href="#">비밀번호 찾기</a></li>
    <li><a href="#">회원가입</a></li>
  </ul>
  <section class="demo" aria-labelledby="demo-title">
    <h2 id="demo-title">예시 계정</h2>
    <p>아이디 <code>reader01</code> / 비밀번호 <code>green1234</code></p>
  </section>
</main>
<script src="login.js"></script>
</body>
</html>
