<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 - 한국 웹 접근성 플레이그라운드</title>
<meta name="description" content="예시 계정으로 로그인하고 로그아웃합니다.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
<h1 class="brand">푸른숲도서관 로그인</h1>
<div class="card">
<form id="form" novalidate>
<div class="field">
<label for="uid" class="sr-only">아이디</label>
<input id="uid" name="uid" type="text" placeholder="아이디" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="uid-err">
<p id="uid-err" class="err" hidden></p>
</div>
<div class="field">
<label for="pw" class="sr-only">비밀번호</label>
<div class="box pw">
<input id="pw" name="pw" type="password" placeholder="비밀번호" autocomplete="current-password" aria-describedby="pw-err">
<button type="button" id="eye" class="eye" aria-pressed="false" aria-label="비밀번호 표시">
<svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
<svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>
</button>
</div>
<p id="pw-err" class="err" hidden></p>
</div>
<button type="submit" class="btn">로그인</button>
</form>
<nav aria-label="계정 찾기와 가입">
<ul class="links">
<li><a href="#">아이디 찾기</a></li>
<li><a href="#">비밀번호 찾기</a></li>
<li><a href="#">회원가입</a></li>
</ul>
</nav>
</div>
<p class="demo">예시 계정: 아이디 <strong>reader01</strong> / 비밀번호 <strong>green1234</strong></p>
</main>
<script src="script.js"></script>
</body>
</html>
