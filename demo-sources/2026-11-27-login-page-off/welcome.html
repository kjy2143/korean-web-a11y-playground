<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>환영합니다 - 한국 웹 접근성 플레이그라운드</title>

<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
<div class="card welcome">
<h1>reader01님, 환영합니다</h1>

<script>
document.getElementById('logout').addEventListener('click', function () {
  try { sessionStorage.removeItem('loggedIn'); } catch (x) { /* 무시 */ }

});
</script>
